[package]
name = "hush-env"
version = "0.4.1"
edition = "2024"
rust-version = "1.89"
description = "Encrypted, local-first replacement for .env files"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]
repository = "https://github.com/pinkpixel-dev/hush"
homepage = "https://github.com/pinkpixel-dev/hush"
readme = "README.md"
keywords = ["secrets", "dotenv", "env", "encryption", "cli"]
categories = ["command-line-utilities", "cryptography"]
exclude = ["icon.png", ".github"]

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
keyring = "4.2.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
strip = true
