[package]
name = "hush"
version = "0.4.0"
edition = "2024"
description = "Encrypted, local-first replacement for .env files"
license = "Apache-2.0"
authors = ["Pink Pixel <admin@pinkpixel.dev>"]

[dependencies]
age = "0.12.1"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
dotenvy = "0.15.7"
keyring = "4.2.0"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
walkdir = "2.5.0"
zeroize = "1.9.1"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
